apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wger-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/milabla/wger-devops-project.git
    targetRevision: devops-project
    path: k8s
    directory:
      exclude: "*.example.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: wger-devops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
