services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DJANGO_DB_DATABASE:-wger}
      POSTGRES_USER: ${DJANGO_DB_USER:-wger}
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:-wger}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DJANGO_DB_USER:-wger} -d ${DJANGO_DB_DATABASE:-wger}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      DJANGO_DB_DATABASE: ${DJANGO_DB_DATABASE:-wger}
      DJANGO_DB_USER: ${DJANGO_DB_USER:-wger}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:-wger}
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432

      SITE_URL: ${SITE_URL:-http://localhost:8000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}

      AXES_HANDLER: axes.handlers.database.AxesDatabaseHandler

    volumes:
      - static_data:/app/static
      - media_data:/app/media
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/static:ro
      - media_data:/app/media:ro

volumes:
  db_data:
  static_data:
  media_data:
