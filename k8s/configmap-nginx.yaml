apiVersion: v1
kind: ConfigMap
metadata:
  name: wger-nginx-config
  namespace: wger-devops
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        client_max_body_size 50M;

        # Served directly by nginx - matches DJANGO_STATIC_ROOT/MEDIA_ROOT,
        # shared with the django container via an emptyDir volume.
        location /static/ {
            alias /app/static/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public";
        }

        location /media/ {
            alias /app/media/;
            access_log off;
        }

        # nginx and django share the same Pod (same network namespace),
        # so we can talk to django directly over localhost.
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
